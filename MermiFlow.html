<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MermiFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: night-fair arcade. Side rail on desktop, bottom dock on phones; content in glassy neon cards. */
:root{
  color-scheme: dark;
  --bg:#130a1e; --bg2:#1c1030; --panel:#22143a; --panel2:#2b1a48; --line:rgba(255,220,255,.10); --line2:rgba(255,220,255,.18);
  --ink:#fdf1ff; --muted:#bba6d1; --dim:#8a76a3;
  --pink:#ff5fb2; --pink2:#ff9ad0; --mint:#55eec6; --lilac:#b48cff; --butter:#ffd86b; --coral:#ff8a6b; --sky:#7cc8ff;
  --good:#55eec6; --bad:#ff6b8a;
  --display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px; --r2:26px;
  --glow:0 0 0 1px var(--line), 0 18px 40px -18px rgba(0,0,0,.6);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(900px 500px at 85% -10%, rgba(255,95,178,.22), transparent 60%),
   radial-gradient(700px 500px at -10% 40%, rgba(180,140,255,.20), transparent 60%),
   radial-gradient(800px 500px at 60% 120%, rgba(85,238,198,.14), transparent 60%),
   radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.2px) 0 0/22px 22px, var(--bg)}
#app{position:relative;z-index:1;height:100%;display:flex}
/* splash */
.splash{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg)}
.splash .logo{font-size:clamp(46px,9vw,96px)}
.splash p{color:var(--muted);text-align:center;margin-top:8px}
.logo{font-family:var(--display);letter-spacing:.5px;line-height:1;background:linear-gradient(100deg,var(--pink) 10%,var(--lilac) 50%,var(--mint) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,95,178,.35))}
.logo-wave{display:block;height:10px;margin:6px auto 0;width:70%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(85,238,198,.6)}100%{box-shadow:0 0 0 14px rgba(85,238,198,0)}}
/* rail */
.rail{width:236px;flex:none;display:flex;flex-direction:column;gap:6px;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(34,20,58,.75),rgba(19,10,30,.6));backdrop-filter:blur(10px)}
.rail .logo{font-size:34px;padding:0 10px 14px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--muted);font-weight:700;font-size:14.5px;position:relative;transition:background .2s,color .2s}
.nav-btn svg{width:22px;height:22px;flex:none}
.nav-btn:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav-btn.on{background:linear-gradient(100deg,rgba(255,95,178,.22),rgba(180,140,255,.14));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,95,178,.35)}
.nav-btn .dot{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#2a0b1d;font-size:11px;font-weight:800;display:grid;place-items:center}
.rail .me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.me-chip .av{width:44px;height:44px;border-radius:14px;overflow:hidden;flex:none;background:var(--panel2)}
.me-chip b{display:block;font-size:14px}
.coins{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--butter);font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd86b 45%,#e3a72b);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block;flex:none}
main{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{max-width:1120px;margin:0 auto;padding-block:26px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:pop .35s ease both}
.topbar{display:none}
.dock{display:none}
@media (max-width:860px){
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(19,10,30,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar .logo{font-size:26px}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:rgba(26,14,42,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .dock .nav-btn{flex-direction:column;gap:3px;padding:6px 8px;font-size:10.5px;min-width:56px}
  .dock .nav-btn .dot{position:absolute;top:0;right:6px;margin:0;min-width:16px;height:16px;font-size:10px}
  .view{padding-block:16px 110px}
}
/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.05;letter-spacing:.3px}
.h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;letter-spacing:.3px}
.h3{font-weight:800;font-size:16px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.grad-pink{background:linear-gradient(90deg,var(--pink),var(--butter));-webkit-background-clip:text;background-clip:text;color:transparent}
/* blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:linear-gradient(180deg,rgba(43,26,72,.85),rgba(34,20,58,.85));border:1px solid var(--line);border-radius:var(--r2);padding:18px;min-width:0;box-shadow:0 24px 50px -30px rgba(0,0,0,.7)}
.card.tight{padding:14px}
.card.glow{box-shadow:inset 0 0 0 1px rgba(255,95,178,.3),0 20px 60px -25px rgba(255,95,178,.35)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 2px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.07);border:1px solid var(--line);white-space:nowrap}
.pill.pink{background:rgba(255,95,178,.16);color:var(--pink2);border-color:rgba(255,95,178,.3)}
.pill.mint{background:rgba(85,238,198,.13);color:var(--mint);border-color:rgba(85,238,198,.3)}
.pill.butter{background:rgba(255,216,107,.13);color:var(--butter);border-color:rgba(255,216,107,.3)}
.pill.lilac{background:rgba(180,140,255,.15);color:#d6c2ff;border-color:rgba(180,140,255,.3)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:800;font-size:14.5px;background:rgba(255,255,255,.08);border:1px solid var(--line2);transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(100deg,var(--pink),#ff7fc4 50%,var(--lilac));border:0;color:#2a0b1d;box-shadow:0 10px 30px -10px rgba(255,95,178,.7)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.mint{background:var(--mint);color:#06281f;border:0}
.btn.butter{background:var(--butter);color:#2f2205;border:0}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.lg{padding:15px 24px;font-size:16px;border-radius:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,4,18,.45);outline:none;transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,178,.18)}
textarea.input{resize:vertical;min-height:80px}
.err{color:var(--bad);font-size:13px;font-weight:700}
/* swatches */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:12px;border:2px solid transparent;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw.on{border-color:var(--ink);transform:scale(1.08)}
.chip{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(255,95,178,.2);border-color:var(--pink);color:#fff}
.chip .lock{font-size:11px;color:var(--butter)}
/* avatar frames */
.avatar{display:block;width:100%;height:auto}
.av-ring{border-radius:22px;overflow:hidden;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.av-sm{width:36px;height:36px;border-radius:12px;overflow:hidden;flex:none;background:var(--panel2)}
.av-md{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;background:var(--panel2)}
.online-dot{position:relative}
.online-dot::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid var(--bg2)}
/* toast */
#toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{pointer-events:auto;width:fit-content;max-width:100%;padding:11px 16px;border-radius:14px;background:#2d1b4b;border:1px solid var(--line2);font-weight:700;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);animation:pop .3s ease both;display:flex;gap:10px;align-items:center}
.toast.good{border-color:rgba(85,238,198,.5)} .toast.bad{border-color:rgba(255,107,138,.6)} .toast.coin{border-color:rgba(255,216,107,.6)}
/* modal */
.scrim{position:fixed;inset:0;z-index:150;background:rgba(8,3,14,.66);backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:pop .2s ease both}
.modal{width:min(560px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#2c1a49,#21133a);border:1px solid var(--line2);border-radius:28px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
/* stage (fullscreen games) */
.stage{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(28,16,48,.9)}
.stage-body{user-select:none;-webkit-user-select:none;flex:1;min-height:0;position:relative;overflow:auto}
.stage canvas{display:block;touch-action:none}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(19,10,30,.72);backdrop-filter:blur(4px);z-index:5;padding:16px}
.over .card{text-align:center;max-width:380px;width:100%}
/* misc */
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:20px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
.li .grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:14px;border:1px solid var(--line);overflow-x:auto;max-width:100%}
.tab{padding:8px 14px;border-radius:11px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Home ===== */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:26px;background:
  radial-gradient(600px 300px at 90% 0%,rgba(255,95,178,.35),transparent 60%),
  radial-gradient(500px 300px at 0% 100%,rgba(85,238,198,.22),transparent 60%),
  linear-gradient(135deg,#2e1850,#1d1033);border:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero .stars{position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px) 0 0/38px 38px;opacity:.25;mask-image:linear-gradient(90deg,transparent,#000)}
.hero-figs{display:flex;justify-content:center;align-items:end;gap:0;position:relative}
.hero-figs .f{width:42%;max-width:170px;animation:floaty 5s ease-in-out infinite}
.hero-figs .f:nth-child(2){width:48%;max-width:190px;margin:0 -6%;z-index:2;animation-delay:-1.6s}
.hero-figs .f:nth-child(3){animation-delay:-3.2s}
@media (max-width:700px){.hero{grid-template-columns:1fr;padding:20px}.hero-figs{order:-1}}
.stat-tiles{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.stat b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}

/* ===== Games ===== */
.gcard{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.gcard:hover{transform:translateY(-4px);box-shadow:0 24px 40px -20px rgba(255,95,178,.5)}
.gcard .art{aspect-ratio:16/10;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.gcard .art svg{width:100%;height:100%}
.gcard .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.gcard .meta b{font-size:15.5px}
.gcard .meta span{font-size:12.5px;color:var(--muted)}
.gcard .badge{position:absolute;top:10px;left:10px}
.invite-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:linear-gradient(100deg,rgba(255,95,178,.18),rgba(180,140,255,.1));border:1px solid rgba(255,95,178,.35)}
.game-shell{display:flex;flex-direction:column;gap:14px}
.players-bar{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:13px}
.pchip.turn{border-color:var(--mint);background:rgba(85,238,198,.12);animation:pulseRing 1.6s infinite}
.pchip .n{font-size:11px;color:var(--muted);font-weight:700}
.table{border-radius:28px;padding:18px;background:radial-gradient(ellipse at 50% 40%,#3a1f5f,#211237 70%);border:1px solid var(--line2);box-shadow:inset 0 0 60px rgba(0,0,0,.4);min-width:0}
.statusline{font-weight:800;text-align:center;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.25)}
.statusline.me{background:linear-gradient(90deg,rgba(85,238,198,.25),rgba(85,238,198,.08));color:var(--mint)}
/* playing cards */
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pc{width:62px;height:90px;border-radius:12px;background:#fff8fd;color:#2a1340;position:relative;box-shadow:0 6px 14px -6px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.08);display:grid;place-items:center;font-weight:800;transition:transform .15s;flex:none;user-select:none}
.pc.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--mint),0 10px 20px -8px rgba(0,0,0,.6)}
.pc.can:hover{transform:translateY(-6px)}
.pc.dis{filter:saturate(.4) brightness(.75)}
.pc .c-tl,.pc .c-br{position:absolute;font-size:12px;line-height:1;text-align:center}
.pc .c-tl{top:6px;left:6px}.pc .c-br{bottom:6px;right:6px;transform:rotate(180deg)}
.pc .c-mid{font-size:30px;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,#ff5fb2 0 8px,#ff7fc4 8px 16px);box-shadow:inset 0 0 0 4px #fff8fd,0 6px 14px -6px rgba(0,0,0,.6)}
.pc.back::after{content:"M";font-family:var(--display);font-size:28px;color:#fff}
.pc.mini{width:40px;height:58px;border-radius:9px}
.pc.mini .c-mid{font-size:18px}
.pc.mini .c-tl,.pc.mini .c-br{display:none}
/* color game card */
.fc{width:64px;height:94px;border-radius:14px;position:relative;display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 8px 16px -8px rgba(0,0,0,.7);flex:none;transition:transform .15s;user-select:none;overflow:hidden}
.fc::before{content:"";position:absolute;inset:6px;border-radius:30px 8px 30px 8px;background:rgba(255,255,255,.92)}
.fc .v{position:relative;font-family:var(--display);font-size:30px;line-height:1}
.fc .cn{position:absolute;font-size:12px;font-weight:800;color:#fff;z-index:1}
.fc .cn.a{top:3px;left:6px}.fc .cn.b{bottom:3px;right:6px}
.fc.c-p{background:#ff4fa8}.fc.c-p .v{color:#ff4fa8}
.fc.c-m{background:#1fd3a5}.fc.c-m .v{color:#13a982}
.fc.c-l{background:#9a6bff}.fc.c-l .v{color:#7f4dff}
.fc.c-b{background:#ffbf2e}.fc.c-b .v{color:#d99300}
.fc.c-w{background:conic-gradient(#ff4fa8 0 25%,#1fd3a5 0 50%,#9a6bff 0 75%,#ffbf2e 0)}
.fc.c-w .v{background:linear-gradient(90deg,#ff4fa8,#9a6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.fc.can{cursor:pointer}.fc.can:hover{transform:translateY(-8px) rotate(-2deg)}
.fc.dis{filter:brightness(.55) saturate(.6)}
.fc.big{width:84px;height:122px}.fc.big .v{font-size:40px}
.fc.back{background:linear-gradient(135deg,#2e1850,#4b2780)}
.fc.back::before{background:transparent;border:2px solid rgba(255,255,255,.3)}
.fc.back .v{color:#fff;font-size:20px}
/* stack game */
.sb{width:56px;height:80px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.7),inset 0 0 0 3px rgba(255,255,255,.35);position:relative;flex:none;user-select:none;transition:transform .15s}
.sb.r1{background:linear-gradient(160deg,#3ee6bb,#14a884)}
.sb.r2{background:linear-gradient(160deg,#ff7cc0,#e2348d)}
.sb.r3{background:linear-gradient(160deg,#b896ff,#7a4ee8)}
.sb.j{background:linear-gradient(135deg,#ffd86b,#ff5fb2,#b48cff);font-size:22px}
.sb.empty{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 2px dashed rgba(255,255,255,.2);color:var(--dim);font-size:13px;font-family:var(--body);font-weight:700;border:2px dashed rgba(255,255,255,.18)}
.sb.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--butter)}
.sb.target{box-shadow:0 0 0 3px var(--mint);cursor:pointer}
.sb .cnt{position:absolute;bottom:-8px;right:-8px;font-family:var(--body);font-size:11px;background:var(--bg);border:1px solid var(--line2);padding:1px 6px;border-radius:8px}
/* okey tiles */
.rack{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:12px;border-radius:18px;background:linear-gradient(180deg,#7a4a2a,#5a3219);box-shadow:inset 0 3px 0 rgba(255,255,255,.15),0 10px 20px -10px rgba(0,0,0,.8)}
.tile{width:40px;height:56px;border-radius:8px;background:linear-gradient(180deg,#fffaf0,#f1e6d2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:21px;box-shadow:0 3px 0 #cbb994,0 6px 10px -4px rgba(0,0,0,.5);user-select:none;flex:none;transition:transform .12s;position:relative}
.tile i{width:8px;height:8px;border-radius:50%;margin-top:3px;background:currentColor;opacity:.8}
.tile.k-r{color:#e23a5d}.tile.k-b{color:#1d2b6b}.tile.k-u{color:#1b8be0}.tile.k-y{color:#e08a00}
.tile.joker{color:#9a6bff}
.tile.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--mint),0 6px 10px -4px rgba(0,0,0,.5)}
.tile.okey::after{content:"★";position:absolute;top:1px;right:3px;font-size:10px;color:#ff5fb2}
/* battleship */
.bs-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.bs-wrap{grid-template-columns:minmax(0,1fr)}}
.bs-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:8px;border-radius:18px;background:linear-gradient(180deg,#14385a,#0f2742);aspect-ratio:1;max-width:400px;margin:0 auto;width:100%}
.bs-cell{border-radius:6px;background:rgba(124,200,255,.13);position:relative;display:grid;place-items:center;font-size:14px;transition:background .15s}
.bs-cell.ship{background:linear-gradient(180deg,#ffb3dc,#ff5fb2)}
.bs-cell.hit{background:#ff5f7a}.bs-cell.hit::after{content:"✸";color:#fff;font-size:16px}
.bs-cell.miss::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55)}
.bs-cell.sunk{background:#7a1f3a}
.bs-cell.aim{cursor:crosshair}.bs-cell.aim:hover{background:rgba(85,238,198,.45)}
.bs-cell.prev{background:rgba(85,238,198,.5)}
.bs-cell.bad{background:rgba(255,107,138,.5)}
/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px;border-radius:22px;background:linear-gradient(180deg,#5b2fa3,#3d1d78);max-width:480px;margin:0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.c4 button{aspect-ratio:1;border-radius:50%;background:#1a0d2e;box-shadow:inset 0 4px 8px rgba(0,0,0,.6)}
.c4 button.p0{background:radial-gradient(circle at 35% 30%,#ffc2e2,#ff5fb2 60%,#d63a8c);animation:pop .3s}
.c4 button.p1{background:radial-gradient(circle at 35% 30%,#d6fff3,#55eec6 60%,#1fb58f);animation:pop .3s}
.c4 button.win{box-shadow:0 0 0 3px #fff,0 0 20px #fff}
/* pets */
.pet-stage{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,255,.12),transparent 50%),linear-gradient(180deg,#3a1e63,#25133f);display:grid;place-items:center}
.pet-stage .pet{width:58%;max-width:300px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.pet-stage .floor{position:absolute;left:15%;right:15%;bottom:9%;height:18px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(6px)}
.pet-stage .fx{position:absolute;font-size:28px;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.need{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-weight:700;font-size:13px}
.battle{display:grid;gap:12px}
.fighter{display:flex;gap:12px;align-items:center}
.fighter .pet{width:120px;flex:none}
.fighter.foe{flex-direction:row-reverse;text-align:right}
.fighter .pet.hit{animation:shake .4s}
.hp{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#a6ffe6);transition:width .6s}
.hp i.low{background:linear-gradient(90deg,var(--bad),var(--coral))}
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.move{padding:12px;border-radius:14px;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:800}
.move small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.move:hover{background:rgba(255,95,178,.15)}
.blog{font-size:13px;color:var(--muted);max-height:110px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:380px}
@media (max-width:860px){.chat{height:calc(100dvh - 205px - env(safe-area-inset-bottom,0px))}}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px 4px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:82%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--panel2);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.msg.mine .bubble{border-radius:18px 18px 6px 18px;background:linear-gradient(120deg,#ff5fb2,#c06cff);border:0;color:#fff}
.bubble .who{font-size:11px;font-weight:800;color:var(--mint);margin-bottom:2px}
.bubble .t{font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.bubble.sticker{background:none;border:0;font-size:46px;padding:0}
.msg.mine .bubble.sticker{background:none}
.sysmsg{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);padding:5px 12px;border-radius:999px;text-align:center}
.composer{display:flex;gap:8px;padding-top:10px;align-items:flex-end}
.composer .input{border-radius:18px}
.stickers{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
.stickers button{font-size:24px;padding:4px 6px;border-radius:10px}
.stickers button:hover{background:rgba(255,255,255,.08)}
.onl-name{font-weight:700}
@media (max-width:600px){.onl-name{display:none}}
.daysep{align-self:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:8px 0}
/* feed */
.post{display:flex;flex-direction:column;gap:12px}
.post .img{border-radius:18px;overflow:hidden;background:var(--bg2);max-width:100%}
.post .img img{display:block;width:100%;max-height:520px;object-fit:cover}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:800;font-size:13px}
.act.on{color:var(--pink);background:rgba(255,95,178,.14)}
.comment{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.comment .c{background:rgba(255,255,255,.05);padding:7px 11px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.story-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:76px;font-size:12px;font-weight:700}
.story .ring{width:68px;height:68px;border-radius:24px;padding:3px;background:linear-gradient(135deg,var(--pink),var(--butter),var(--mint))}
.story .ring>div{width:100%;height:100%;border-radius:21px;overflow:hidden;background:var(--panel2);border:3px solid var(--bg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:11px;font-weight:800;color:var(--dim);text-align:center;letter-spacing:.08em;text-transform:uppercase;padding-bottom:4px}
.cal .d{min-height:86px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.cal .d.sel{background:rgba(255,95,178,.12)}
.cal .d .n{font-weight:800;font-size:13px}
.cal .ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1b0b26}
@media (max-width:600px){.cal .d{min-height:58px;padding:4px}.cal .ev{font-size:0;height:6px;padding:0;border-radius:4px}}
/* shop */
.item{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;padding:12px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.item .prev{aspect-ratio:1;border-radius:16px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.item .prev svg{width:90%;height:90%}
.item.owned{border-color:rgba(85,238,198,.35)}
/* tycoon */
.ty-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;height:100%}
.ty-side{border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(28,16,48,.7)}
@media (max-width:860px){.ty-wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 42%}.ty-side{border-left:0;border-top:1px solid var(--line)}}
.up{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;width:100%}
.up .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.07);flex:none}
.up .grow{flex:1;min-width:0}
.up .cost{font-weight:800;color:var(--butter);font-size:13px;white-space:nowrap}
.up[disabled]{opacity:.5}
/* ad */
.ad{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(135deg,#ff7fc4,#ffb36b 55%,#ffd86b);color:#3b0e2a}
.ad .tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;letter-spacing:.14em;background:rgba(0,0,0,.18);color:#fff;padding:3px 8px;border-radius:999px}
.ad h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.ad .floaters span{position:absolute;font-size:30px;animation:floaty 3s ease-in-out infinite}
.ad.boba{background:linear-gradient(135deg,#a98bff,#6fd9ff 55%,#a6ffe6);color:#160c3b}
/* admin */
.req{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:18px;background:rgba(255,216,107,.07);border:1px solid rgba(255,216,107,.3)}
/* waiting */
.center-screen{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;width:100%}
.onb{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:800px){.onb{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;gap:6px}
.steps i{height:6px;flex:1;border-radius:4px;background:rgba(255,255,255,.12)}
.steps i.on{background:linear-gradient(90deg,var(--pink),var(--lilac))}
.music-btn.on{color:var(--mint);box-shadow:inset 0 0 0 1px rgba(85,238,198,.4)}
.eq{display:inline-flex;gap:2px;align-items:end;height:14px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* ===== Comic ink layer: matches the illustrated characters ===== */

.gcard{border:2.5px solid var(--lnk);box-shadow:5px 5px 0 var(--lnk)}
.gcard:hover{box-shadow:7px 9px 0 var(--lnk)}
.gcard .art{border-bottom:2.5px solid var(--lnk)}
.ad{border:2.5px solid var(--lnk);box-shadow:5px 5px 0 var(--lnk)}
.hero{border:2.5px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk)}
.av-ring,.item .prev{border:2.5px solid var(--lnk)}
.pc,.fc,.sb,.tile{border:2.5px solid var(--lnk)}
.pc,.fc,.sb{box-shadow:3px 3px 0 var(--lnk)}
.tile{box-shadow:0 3px 0 #cbb994,2px 5px 0 var(--lnk)}
.pc.sel{box-shadow:0 0 0 3px var(--mint),3px 3px 0 var(--lnk)}
.sb.sel{box-shadow:0 0 0 3px var(--butter),3px 3px 0 var(--lnk)}
.sb.target{box-shadow:0 0 0 3px var(--mint),3px 3px 0 var(--lnk)}
.tile.sel{box-shadow:0 0 0 3px var(--mint),2px 5px 0 var(--lnk)}
.sb.empty{border:2px dashed rgba(255,255,255,.25);box-shadow:none}
.fc::before{border:2px solid rgba(29,16,38,.25)}
.c4{border:3px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk)}
.c4 button{border:2.5px solid var(--lnk)}
.bs-grid{border:3px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk)}
.bs-cell{border:1.5px solid rgba(29,16,38,.55)}
.bs-cell.ship{border-color:var(--lnk)}
.rack{border:3px solid var(--lnk);box-shadow:5px 5px 0 var(--lnk)}
.table{border:2.5px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk),inset 0 0 60px rgba(0,0,0,.4);
  background:radial-gradient(rgba(255,255,255,.07) 1.1px,transparent 1.5px) 0 0/12px 12px,repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.035) 0 10deg,transparent 10deg 20deg),radial-gradient(ellipse at 50% 40%,#43236b,#211237 72%)}
.pet-stage{border:2.5px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk);background:radial-gradient(ellipse at 50% 88%,rgba(255,255,255,.14),transparent 50%),repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.04) 0 9deg,transparent 9deg 18deg),linear-gradient(180deg,#3a1e63,#25133f)}
.pet-stage::before{content:"";position:absolute;left:0;right:0;top:14px;height:14px;background:radial-gradient(circle,#ffd86b 0 3.5px,transparent 4.5px) 0 0/30px 14px;opacity:.9}
.fighter.card,.statusline{border:2px solid var(--lnk)}
.move{border:2px solid var(--lnk);box-shadow:3px 3px 0 var(--lnk)}
.move:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--lnk)}
.btn.primary,.btn.mint,.btn.butter{border:2px solid var(--lnk);box-shadow:3px 3px 0 var(--lnk)}
.btn.primary:active,.btn.mint:active,.btn.butter:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--lnk)}
.over .card{border:2.5px solid var(--lnk);box-shadow:6px 6px 0 var(--lnk)}

<script>
/* ================= MermiFlow core ================= */
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function deepMerge(t, s) { const o = isObj(t) ? { ...t } : {}; for (const k in s) { o[k] = isObj(s[k]) && isObj(o[k]) ? deepMerge(o[k], s[k]) : (isObj(s[k]) ? deepMerge({}, s[k]) : s[k]); } return o; }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
const fmtTime = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const fmtDay = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'gerade eben'; if (s < 3600) return `vor ${Math.floor(s / 60)} Min.`; if (s < 86400) return `vor ${Math.floor(s / 3600)} Std.`; return fmtDay(t); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* ---------- Store: shared db when published, local demo otherwise ---------- */
const Store = {
  mode: 'local', db: null, local: null, listeners: [],
  async init() {
    let db = null;
    try { if (window.claude?.use) db = await window.claude.use('db'); } catch { db = null; }
    if (db) { this.mode = 'db'; this.db = db; return; }
    this.mode = 'local';
    this.local = lsGet('mf-demo-store', {});
  },
  _persist() { lsSet('mf-demo-store', this.local); },
  _emit(path) {
    for (const l of this.listeners) {
      if (l.doc ? l.path === path : path.startsWith(l.path + '/') && path.split('/').length === l.path.split('/').length + 1) l.fire();
    }
  },
  _colDocs(col) {
    const out = []; const n = col.split('/').length + 1;
    for (const p in this.local) if (p.startsWith(col + '/') && p.split('/').length === n) out.push({ id: p.split('/').pop(), ...this.local[p] });
    return out;
  },
  watch(col, cb, opt = {}) {
    if (this.mode === 'db') {
      let q = this.db.collection(col);
      if (opt.orderBy) q = q.orderBy(opt.orderBy, opt.dir || 'asc');
      if (opt.limit) q = q.limit(opt.limit);

  Store.watch('posts', docs => { App.posts = docs.sort((a, b) => b.at - a.at); onData('posts'); }, { orderBy: 'at', dir: 'desc', limit: 80 });
  Store.watch('events', docs => { App.events = docs.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))); onData('events'); });

}

function onData(kind) {

async function compressImage(file, max = 1080, q = .78) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return { canvas: c, blob: await new Promise(r => c.toBlob(r, 'image/jpeg', q)) };
}
async function uploadImage(file) {
  let assets = null; try { assets = window.claude?.use ? await window.claude.use('assets') : null; } catch { }
  if (assets) { try { const { blob } = await compressImage(file); const r = await assets.upload(blob); return { img: r.url, imgId: r.id }; } catch (e) { console.warn('asset upload', e); } }
  let { canvas } = await compressImage(file, 720, .7); let d = canvas.toDataURL('image/jpeg', .7);
  if (d.length > 190000) d = canvas.toDataURL('image/jpeg', .45);
  if (d.length > 200000) { const c2 = document.createElement('canvas'); c2.width = canvas.width / 2; c2.height = canvas.height / 2; c2.getContext('2d').drawImage(canvas, 0, 0, c2.width, c2.height); d = c2.toDataURL('image/jpeg', .6); }
  return { img: d };
}

/* ---------- Calendar ---------- */
const Cal = {
  expand(evs, year = new Date().getFullYear()) {
    const out = [];
    for (const e of evs) { if (e.yearly) { for (const y of [year - 1, year, year + 1]) out.push({ ...e, date: y + e.date.slice(4) }); } else out.push(e); }
    return out.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  },
};

  };
  return { mount(el) { root = el; draw(); }, onData(k) { if (k === 'members' || k === 'pet') draw(); } };
};

/* ================= Online games: lobby + turn-based games over the shared store ================= */
const nextOf = (players, cur, dir = 1, skip = 0) => { const n = players.length; let i = players.indexOf(cur); i = (((i + dir * (1 + skip)) % n) + n) % n; return players[i]; };
const UI = {}; const ui = gid => (UI[gid] = UI[gid] || { sel: [] });
const nm = uid => esc(App.name(uid));

/* ---------- Vier gewinnt ---------- */
const C4 = {
  init(pl) { return { state: { board: Array(42).fill(-1), last: -1, line: [] }, turn: pick(pl) }; },
  check(b, i) {
    const p = b[i], r = Math.floor(i / 7), c = i % 7;
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [i];
      for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < 6 && cc >= 0 && cc < 7 && b[rr * 7 + cc] === p) { line.push(rr * 7 + cc); rr += dr * s; cc += dc * s; } }
      if (line.length >= 4) return line;
    }
    return null;
  },
  render(el, g, me, commit) {
    const s = g.state, myTurn = g.turn === me && g.status === 'playing', idx = g.players.indexOf(me);
    el.innerHTML = `<div class="stack"><div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? `Du bist dran – deine Farbe: ${idx === 0 ? 'Pink' : 'Mint'}` : `${nm(g.turn)} ist dran …`}</div>
      <div class="c4">${s.board.map((v, i) => `<button data-c="${i % 7}" class="${v >= 0 ? 'p' + v : ''} ${s.line.includes(i) ? 'win' : ''}" aria-label="Spalte ${i % 7 + 1}"></button>`).join('')}</div>
      <div class="row" style="justify-content:center">${g.players.map((p, i) => `<span class="pill ${i ? 'mint' : 'pink'}">● ${nm(p)}</span>`).join('')}</div></div>`;
    if (!myTurn) return;
    $$('[data-c]', el).forEach(b => b.onclick = () => {
      const c = +b.dataset.c; let i = -1; for (let r = 5; r >= 0; r--) if (s.board[r * 7 + c] < 0) { i = r * 7 + c; break; }
      if (i < 0) return; Music.sfx('pop');
      commit(st => { st.board[i] = idx; st.last = i; const line = C4.check(st.board, i); if (line) { st.line = line; return { winner: me }; } if (st.board.every(v => v >= 0)) return { winner: 'draw' }; return { turn: nextOf(g.players, me) }; });
    });
  },
};

/* ---------- Schiffe versenken ---------- */
const BS = {
  N: 8, FLEET: [4, 3, 3, 2, 2],
  init(pl) { return { state: { phase: 'place', boards: Object.fromEntries(pl.map(p => [p, { ships: [], shots: [] }])), ready: {} }, turn: pick(pl) }; },
  cellsFor(start, len, dir) { const N = this.N, r = Math.floor(start / N), c = start % N; const out = []; for (let k = 0; k < len; k++) { const rr = r + (dir === 'v' ? k : 0), cc = c + (dir === 'h' ? k : 0); if (rr >= N || cc >= N) return null; out.push(rr * N + cc); } return out; },
  valid(cells, ships) { if (!cells) return false; const occ = new Set(); const N = this.N; for (const s of ships) for (const x of s.cells) { const r = Math.floor(x / N), c = x % N; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) occ.add(rr * N + cc); } } return cells.every(x => !occ.has(x)); },
  random() { for (let t = 0; t < 200; t++) { const ships = []; let ok = true; for (const len of this.FLEET) { let placed = false; for (let k = 0; k < 200 && !placed; k++) { const cells = this.cellsFor(ri(0, 63), len, Math.random() < .5 ? 'h' : 'v'); if (this.valid(cells, ships)) { ships.push({ cells }); placed = true; } } if (!placed) { ok = false; break; } } if (ok) return ships; } return []; },
  sunk(ship, shots) { return ship.cells.every(c => shots.includes(c)); },
  grid(board, opt) {
    const shots = board.shots || []; const shipCells = new Map(); board.ships.forEach((s, i) => s.cells.forEach(c => shipCells.set(c, i)));
    return `<div class="bs-grid">${Array.from({ length: 64 }, (_, i) => {
      const si = shipCells.get(i), shot = shots.includes(i), isShip = si !== undefined;
      let cls = '';
      if (opt.own) cls = isShip ? 'ship' : ''; if (shot) cls = isShip ? (this.sunk(board.ships[si], shots) ? 'sunk hit' : 'hit') : 'miss';
      if (opt.enemy) { cls = shot ? (isShip ? (this.sunk(board.ships[si], shots) ? 'sunk hit' : 'hit') : 'miss') : (opt.aim ? 'aim' : ''); }
      if (opt.preview?.includes(i)) cls += opt.bad ? ' bad' : ' prev';
      return `<button class="bs-cell ${cls}" data-i="${i}" aria-label="Feld ${String.fromCharCode(65 + Math.floor(i / 8))}${i % 8 + 1}"></button>`;
    }).join('')}</div>`;
  },
  render(el, g, me, commit, U) {
    const s = g.state, opp = g.players.find(p => p !== me), myB = s.boards[me], oppB = s.boards[opp];
    if (s.phase === 'place') {
      if (s.ready[me]) { el.innerHTML = `<div class="stack"><div class="statusline">Deine Flotte steht. Warte auf ${nm(opp)} …</div><div style="max-width:380px;margin:0 auto;width:100%">${this.grid(myB, { own: true })}</div></div>`; return; }
      U.ships = U.ships || []; U.dir = U.dir || 'h';
      const nextLen = this.FLEET[U.ships.length];
      el.innerHTML = `<div class="stack"><div class="statusline me">${nextLen ? `Platziere dein Schiff mit Länge ${nextLen} (${U.ships.length + 1}/${this.FLEET.length})` : 'Alle Schiffe platziert!'}</div>
        <div style="max-width:400px;margin:0 auto;width:100%" id="pg">${this.grid({ ships: U.ships, shots: [] }, { own: true })}</div>
        <div class="row" style="justify-content:center"><button class="btn sm" id="rot">Drehen: ${U.dir === 'h' ? 'waagerecht' : 'senkrecht'}</button><button class="btn sm" id="rnd">Zufällig</button><button class="btn sm ghost" id="clr">Neu</button><button class="btn primary" id="rdy" ${nextLen ? 'disabled' : ''}>Bereit!</button></div></div>`;
      const pg = $('#pg', el);
      const show = (i, final) => { const cells = this.cellsFor(i, nextLen, U.dir); const ok = this.valid(cells, U.ships); if (final) { if (ok) { U.ships.push({ cells }); Music.sfx('pop'); this.render(el, g, me, commit, U); } return; } pg.innerHTML = this.grid({ ships: U.ships, shots: [] }, { own: true, preview: cells || [i], bad: !ok }); bindCells(); };
      const bindCells = () => $$('.bs-cell', pg).forEach(b => { b.onmouseenter = () => nextLen && show(+b.dataset.i); b.onclick = () => nextLen && show(+b.dataset.i, true); });
      bindCells();
      $('#rot', el).onclick = () => { U.dir = U.dir === 'h' ? 'v' : 'h'; this.render(el, g, me, commit, U); };
      $('#rnd', el).onclick = () => { U.ships = this.random(); this.render(el, g, me, commit, U); };
      $('#clr', el).onclick = () => { U.ships = []; this.render(el, g, me, commit, U); };
      $('#rdy', el).onclick = async () => { await save(`games/${g.id}`, { state: { boards: { [me]: { ships: U.ships, shots: [] } }, ready: { [me]: true } }, updatedAt: Date.now() }); Music.sfx('pling'); };
      return;
    }
    const myTurn = g.turn === me && g.status === 'playing';
    const left = b => b.ships.filter(sh => !this.sunk(sh, b.shots)).length;
    el.innerHTML = `<div class="stack"><div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? 'Du bist dran – wähle ein Feld beim Gegner. Treffer = nochmal!' : `${nm(opp)} zielt auf deine Flotte …`}</div>
      <div class="bs-wrap"><div class="stack" style="gap:8px"><div class="row between"><b>Flotte von ${nm(opp)}</b><span class="pill">${left(oppB)} Schiffe übrig</span></div>${this.grid(oppB, { enemy: true, aim: myTurn })}</div>
      <div class="stack" style="gap:8px"><div class="row between"><b>Deine Flotte</b><span class="pill">${left(myB)} Schiffe übrig</span></div>${this.grid(myB, { own: true })}</div></div></div>`;
    if (g.status === 'done') { // reveal enemy ships at the end
      $$('.bs-grid', el)[0].outerHTML = this.grid(oppB, { own: true });
    }
    if (!myTurn) return;
    $$('.bs-grid', el)[0].querySelectorAll('.bs-cell.aim').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      commit(st => {
        const B = st.boards[opp]; if (B.shots.includes(i)) return {};
        B.shots.push(i); const ship = B.ships.find(sh => sh.cells.includes(i));
        if (ship) { Music.sfx('hit'); if (this.sunk(ship, B.shots)) { toast('Versenkt! 💥', 'good'); ship.cells.forEach(c => { const r = Math.floor(c / 8), cc = c % 8; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, c2 = cc + dc; if (rr >= 0 && rr < 8 && c2 >= 0 && c2 < 8 && !B.shots.includes(rr * 8 + c2)) B.shots.push(rr * 8 + c2); } }); } if (B.ships.every(sh => this.sunk(sh, B.shots))) return { winner: me }; return { turn: me }; }
        Music.sfx('pop'); return { turn: opp };
      });
    });
  },
  tick(g) { if (g.state.phase === 'place' && g.players.every(p => g.state.ready[p]) && g.host === App.me) save(`games/${g.id}`, { state: { phase: 'battle' }, updatedAt: Date.now() }); },
  needs(g, me) { return g.state.phase === 'place' ? !g.state.ready[me] : g.turn === me; },
};

/* ---------- Farbrausch (colour/number shedding game) ---------- */
const FR = {
  COLS: { p: 'Pink', m: 'Mint', l: 'Lila', b: 'Butter' }, SYM: { S: '⊘', R: '⇄', D: '+2', W: '★', F: '+4' },
  deck() { const d = []; for (const c of 'pmlb') { d.push(c + '0'); for (const v of '123456789SRD') d.push(c + v, c + v); } for (let i = 0; i < 4; i++) d.push('wW', 'wF'); return shuffle(d); },
  init(pl) { let d = this.deck(); const hands = {}; pl.forEach(p => hands[p] = d.splice(0, 7)); let i = d.findIndex(c => /^[pmlb][0-9]$/.test(c)); const top = d.splice(i, 1)[0]; return { state: { draw: d, pile: [top], hands, color: top[0], dir: 1, drew: false, last: 'Los geht\'s!' }, turn: pick(pl) }; },
  can(st, c) { const t = st.pile[st.pile.length - 1]; return c[0] === 'w' || c[0] === st.color || c[1] === t[1]; },
  card(c, cls = '', attrs = '') { const col = c[0] === 'w' ? 'w' : c[0]; const v = this.SYM[c[1]] || c[1]; return `<div class="fc c-${col} ${cls}" ${attrs}><span class="cn a">${v}</span><span class="v">${v}</span><span class="cn b">${v}</span></div>`; },
  drawN(st, uid, n) { for (let k = 0; k < n; k++) { if (!st.draw.length) { const top = st.pile.pop(); st.draw = shuffle(st.pile); st.pile = [top]; } if (st.draw.length) st.hands[uid].push(st.draw.pop()); } },
  render(el, g, me, commit, U) {
    const s = g.state, myTurn = g.turn === me && g.status === 'playing', hand = s.hands[me] || [], top = s.pile[s.pile.length - 1];
    const opps = g.players.filter(p => p !== me);
    el.innerHTML = `<div class="stack">
      <div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? (s.drew ? 'Spiele eine passende Karte oder gib weiter.' : 'Du bist dran – lege eine passende Karte oder ziehe.') : `${nm(g.turn)} ist dran …`}</div>
      <div class="table stack" style="align-items:center">
        <div class="row" style="justify-content:center;gap:18px">${opps.map(p => `<div class="stack" style="align-items:center;gap:6px"><div class="pchip ${g.turn === p ? 'turn' : ''}"><div class="av-sm" style="width:28px;height:28px">${App.members[p] ? Art.avatar(App.members[p].avatar, { bust: true }) : ''}</div>${nm(p)}</div><div class="row" style="gap:0">${Array.from({ length: Math.min(10, s.hands[p].length) }, () => `<div class="fc back" style="width:26px;height:38px;margin-left:-10px;border-radius:6px"><span class="v"></span></div>`).join('')}<span class="pill" style="margin-left:8px">${s.hands[p].length}</span></div></div>`).join('')}</div>
        <div class="row" style="justify-content:center;gap:22px;margin:10px 0">
          <button class="fc back big ${myTurn && !s.drew ? 'can' : ''}" id="drawp" aria-label="Karte ziehen"><span class="v">MERMI</span></button>
          ${this.card(top, 'big')}
          <div class="stack" style="gap:6px;align-items:center"><span class="small muted">Farbe</span><span class="fc c-${s.color}" style="width:34px;height:34px;border-radius:50%"></span><span class="small muted">${s.dir === 1 ? '↻' : '↺'}</span></div>
        </div>
        <div class="small muted" style="text-align:center">${esc(s.last || '')}</div>
      </div>
      ${U.pickColor !== undefined ? `<div class="card row" style="justify-content:center"><b>Farbe wählen:</b>${Object.entries(this.COLS).map(([k, n]) => `<button class="btn sm" data-col="${k}"><span class="fc c-${k}" style="width:18px;height:18px;border-radius:50%"></span>${n}</button>`).join('')}<button class="btn sm ghost" id="nocol">Abbrechen</button></div>` : ''}

      ${myTurn && s.drew ? `<div class="row" style="justify-content:center"><button class="btn" id="pass">Weiter</button></div>` : ''}

    if (!myTurn) return;
    const play = (i, col) => {
      commit(st => {
        const c = st.hands[me].splice(i, 1)[0]; st.pile.push(c); st.color = c[0] === 'w' ? col : c[0]; st.drew = false;

    $$('[data-h]', el).forEach(b => b.onclick = () => { const i = +b.dataset.h, c = hand[i]; if (!this.can(s, c)) return; if (c[0] === 'w') { U.pickColor = i; this.render(el, g, me, commit, U); return; } play(i); });
    $$('[data-col]', el).forEach(b => b.onclick = () => play(U.pickColor, b.dataset.col));
    $('#nocol', el)?.addEventListener('click', () => { delete U.pickColor; this.render(el, g, me, commit, U); });
    $('#drawp', el).onclick = () => { if (s.drew) return; Music.sfx('click'); commit(st => { this.drawN(st, me, 1); st.drew = true; st.last = `${App.name(me)} zieht eine Karte`; return {}; }); };

  },
};

/* ---------- Lügen ---------- */
const LI = {
  RANKS: ['7', '8', '9', '10', 'B', 'D', 'K', 'A'], SUITS: ['♥', '♦', '♣', '♠'],
  init(pl) {
    const d = shuffle(this.RANKS.flatMap(r => this.SUITS.map(s => r + s))); const hands = {}; pl.forEach(p => hands[p] = []); d.forEach((c, i) => hands[pl[i % pl.length]].push(c));
    const out = []; for (const p of pl) this.quads(hands, p, out);
    return { state: { hands, pile: [], claim: null, lastPlay: null, reveal: null, pendingWin: null, out, log: ['Neue Runde – wer anfängt, nennt den Wert.'] }, turn: pick(pl) };
  },
  rank: c => c.slice(0, -1), suit: c => c.slice(-1),
  quads(hands, p, out) { const cnt = {}; hands[p].forEach(c => cnt[this.rank(c)] = (cnt[this.rank(c)] || 0) + 1); for (const r in cnt) if (cnt[r] === 4) { hands[p] = hands[p].filter(c => this.rank(c) !== r); out.push(r); } },
  sortH(h) { return h.slice().sort((a, b) => this.RANKS.indexOf(this.rank(a)) - this.RANKS.indexOf(this.rank(b))); },
  card(c, cls = '', attrs = '') { const red = /[♥♦]/.test(c); const r = this.rank(c), s = this.suit(c); return `<div class="pc ${cls}" ${attrs} style="color:${red ? '#e23a5d' : '#2a1340'}"><span class="c-tl">${r}<br>${s}</span><span class="c-mid">${s}</span><span class="c-br">${r}<br>${s}</span></div>`; },

/* ---------- Stapel-Sprint (build piles 1–12) ---------- */
const SB = {
  init(pl) {
    const d = shuffle([...Array.from({ length: 144 }, (_, i) => i % 12 + 1), ...Array(18).fill(0)]);
    const n = pl.length === 2 ? 20 : 15; const stock = {}, hand = {}, disc = {};
    pl.forEach(p => { stock[p] = d.splice(0, n); hand[p] = []; disc[p] = [[], [], [], []]; });
    const first = pick(pl); hand[first] = d.splice(0, 5);
    return { state: { deck: d, build: [[], [], [], []], done: [], stock, hand, disc, last: 'Lege Karten von 1 bis 12 auf die Mitte.' }, turn: first };
  },
  topVal: pile => pile.length ? pile[pile.length - 1].as : 0,
  refill(st, p) { while (st.hand[p].length < 5) { if (!st.deck.length) { if (!st.done.length) break; st.deck = shuffle(st.done); st.done = []; } st.hand[p].push(st.deck.pop()); } },
  card(v, cls = '', attrs = '', as) { if (v === undefined) return `<div class="sb empty" ${attrs}>leer</div>`; const r = v === 0 ? 'j' : v <= 4 ? 'r1' : v <= 8 ? 'r2' : 'r3'; return `<div class="sb ${r} ${cls}" ${attrs}>${v === 0 ? (as ? `★<small style="font-size:11px;position:absolute;bottom:4px">=${as}</small>` : '★') : v}</div>`; },

    const srcVal = src ? (src.k === 'hand' ? s.hand[me][src.i] : src.k === 'stock' ? s.stock[me][s.stock[me].length - 1] : s.disc[me][src.i][s.disc[me][src.i].length - 1]) : undefined;
    const canOn = j => src && (srcVal === 0 || srcVal === this.topVal(s.build[j]) + 1);
    const pileTop = p => p.length ? p[p.length - 1] : undefined;
    el.innerHTML = `<div class="stack">
      <div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? (src ? 'Wähle einen Ablagestapel in der Mitte' + (src.k === 'hand' ? ' oder beende den Zug auf deinen Ablagen unten.' : '.') : 'Wähle eine Karte: Vorrat, Hand oder Ablage.') : `${nm(g.turn)} ist dran …`}</div>
      <div class="table stack">
        ${opps.map(p => `<div class="row" style="gap:10px;justify-content:center"><div class="pchip ${g.turn === p ? 'turn' : ''}">${nm(p)} <span class="n">Vorrat ${s.stock[p].length}</span></div>${s.stock[p].length ? this.card(pileTop(s.stock[p]), '', 'style="width:44px;height:62px;font-size:22px"') : ''}${s.disc[p].map(d => d.length ? this.card(pileTop(d), '', 'style="width:36px;height:52px;font-size:17px"') : '<div class="sb empty" style="width:36px;height:52px"></div>').join('')}</div>`).join('')}
        <hr class="sep">
        <div class="row" style="justify-content:center;gap:10px"><div class="stack" style="align-items:center;gap:4px"><div class="sb" style="background:linear-gradient(135deg,#2e1850,#4b2780)">${s.deck.length}</div><span class="small dim">Deck</span></div>
          ${s.build.map((b, j) => `<div class="stack" style="align-items:center;gap:4px">${b.length ? this.card(b[b.length - 1].v, myTurn && canOn(j) ? 'target' : '', `data-b="${j}"`, b[b.length - 1].as) : `<div class="sb empty ${myTurn && canOn(j) ? 'target' : ''}" data-b="${j}">1</div>`}<span class="small dim">${b.length ? 'nächste: ' + (this.topVal(b) + 1) : 'starte mit 1'}</span></div>`).join('')}</div>
        <div class="small muted" style="text-align:center">${esc(s.last || '')}</div>
      </div>
      <div class="card stack">
        <div class="row" style="gap:16px;align-items:flex-end;justify-content:center">
          <div class="stack" style="align-items:center;gap:6px"><span class="small muted">Vorrat (${s.stock[me].length})</span>${s.stock[me].length ? this.card(pileTop(s.stock[me]), src?.k === 'stock' ? 'sel' : '', 'data-src="stock"') : this.card(undefined)}</div>
          <div class="stack" style="align-items:center;gap:6px"><span class="small muted">Ablagen</span><div class="row" style="gap:6px">${s.disc[me].map((d, i) => `<div style="position:relative">${d.length ? this.card(pileTop(d), (src?.k === 'disc' && src.i === i ? 'sel ' : '') + (myTurn && src?.k === 'hand' ? 'target' : ''), `data-disc="${i}"`) : `<div class="sb empty ${myTurn && src?.k === 'hand' ? 'target' : ''}" data-disc="${i}">+</div>`}${d.length > 1 ? `<span class="cnt">${d.length}</span>` : ''}</div>`).join('')}</div></div>
        </div>

      </div></div>`;
    if (!myTurn) return;
    const sel = (k, i) => { U.src = src && src.k === k && src.i === i ? null : { k, i }; Music.sfx('click'); this.render(el, g, me, commit, U); };
    $$('[data-hand]', el).forEach(b => b.onclick = () => sel('hand', +b.dataset.hand));

    $$('[data-b]', el).forEach(b => b.onclick = () => {
      const j = +b.dataset.b; if (!canOn(j)) return; const S0 = src; U.src = null; Music.sfx('pop');
      commit(st => {
        let v; if (S0.k === 'hand') v = st.hand[me].splice(S0.i, 1)[0]; else if (S0.k === 'stock') v = st.stock[me].pop(); else v = st.disc[me][S0.i].pop();
        const as = this.topVal(st.build[j]) + 1; st.build[j].push({ v, as });
        st.last = `${App.name(me)} legt ${v === 0 ? '★ als ' + as : v}`;
        if (as === 12) { st.done.push(...st.build[j].map(x => x.v)); st.build[j] = []; st.last += ' – Stapel komplett!'; }
        if (S0.k === 'stock' && !st.stock[me].length) return { winner: me };
        if (!st.hand[me].length) this.refill(st, me);

  },
};

/* ---------- Okey ---------- */
const OK = {
  COLS: { r: 'Rot', b: 'Schwarz', u: 'Blau', y: 'Gelb' },
  init(pl) {
    let d = []; for (const c of 'rbuy') for (let n = 1; n <= 13; n++) d.push(`${c}${n}a`, `${c}${n}b`); d.push('J1', 'J2'); d = shuffle(d);
    const ii = d.findIndex(t => t[0] !== 'J'); const ind = d.splice(ii, 1)[0];
    const hands = {}, disc = {}; const first = pick(pl);
    pl.forEach(p => { hands[p] = d.splice(0, p === first ? 15 : 14); disc[p] = []; });
    return { state: { deck: d, ind, hands, disc, drawn: true, last: 'Okey beginnt! Wer 15 Steine hat, wirft zuerst ab.' }, turn: first };
  },
  parse(t) { if (t[0] === 'J') return { j: true }; return { c: t[0], n: parseInt(t.slice(1)) }; },
  okeyOf(ind) { const p = this.parse(ind); return { c: p.c, n: p.n === 13 ? 1 : p.n + 1 }; },
  isOkey(t, ok) { const p = this.parse(t); return !p.j && p.c === ok.c && p.n === ok.n; },
  valid(tiles, ind) {
    const ok = this.okeyOf(ind); let w = 0; const arr = [];
    for (const t of tiles) { if (this.isOkey(t, ok)) w++; else { const p = this.parse(t); arr.push(p.j ? { ...ok } : p); } }
    // seven pairs
    const cnt = {}; arr.forEach(x => { const k = x.c + x.n; cnt[k] = (cnt[k] || 0) + 1; }); let pairs = 0, singles = 0; for (const k in cnt) { pairs += Math.floor(cnt[k] / 2); singles += cnt[k] % 2; }
    if (singles <= w && pairs + singles + Math.floor((w - singles) / 2) >= 7) return true;
    arr.sort((a, b) => a.c === b.c ? a.n - b.n : a.c < b.c ? -1 : 1);
    const solve = (list, w, groups) => {
      if (!list.length) return w === 0 || groups > 0;
      const t = list[0], rest = list.slice(1);
      // sets
      const others = []; const seen = new Set([t.c]); rest.forEach((x, i) => { if (x.n === t.n && !seen.has(x.c)) { seen.add(x.c); others.push(i); } });
      const subsets = [[]]; for (const i of others) { const L = subsets.length; for (let k = 0; k < L; k++) subsets.push([...subsets[k], i]); }
      for (const sub of subsets) for (let u = 0; u <= w; u++) { const size = 1 + sub.length + u; if (size < 3 || size > 4) continue; const r2 = rest.filter((_, i) => !sub.includes(i)); if (solve(r2, w - u, groups + 1)) return true; }
      // runs: t is lowest real tile; optional wilds before
      for (let pre = 0; pre <= Math.min(w, t.n - 1); pre++) {
        let r2 = rest.slice(), wl = w - pre, len = 1 + pre, v = t.n;
        while (true) {
          if (len >= 3 && solve(r2, wl, groups + 1)) return true;
          v++; if (v > 13) break;
          const i = r2.findIndex(x => x.c === t.c && x.n === v);
          if (i >= 0) { r2 = r2.slice(0, i).concat(r2.slice(i + 1)); len++; }
          else if (wl > 0) { wl--; len++; } else break;
        }
      }
      return false;
    };
    return solve(arr, w, 0);
  },
  tile(t, ind, cls = '', attrs = '') {
    if (!t) return `<div class="tile" style="opacity:.25" ${attrs}></div>`;
    const ok = this.okeyOf(ind); const p = this.parse(t);
    if (p.j) return `<div class="tile joker ${cls}" ${attrs}>★<i></i></div>`;
    return `<div class="tile k-${p.c} ${this.isOkey(t, ok) ? 'okey' : ''} ${cls}" ${attrs}>${p.n}<i></i></div>`;
  },
  order(h, mode, ind) { const ok = this.okeyOf(ind); const key = t => { const p = this.parse(t); if (p.j || this.isOkey(t, ok)) return mode === 'n' ? 99 : 'zz'; return mode === 'n' ? p.n * 10 + 'rbuy'.indexOf(p.c) : p.c + String(p.n).padStart(2, '0'); }; return h.slice().sort((a, b) => key(a) > key(b) ? 1 : -1); },
  render(el, g, me, commit, U) {
    const s = g.state, myTurn = g.turn === me && g.status === 'playing', prev = g.players[(g.players.indexOf(me) - 1 + g.players.length) % g.players.length];
    const hand = this.order(s.hands[me] || [], U.mode || 'c', s.ind); if (!hand.includes(U.selT)) U.selT = null;
    const needDraw = myTurn && hand.length === 14, canDiscard = myTurn && hand.length === 15;
    const ok = this.okeyOf(s.ind); const prevTop = s.disc[prev]?.[s.disc[prev].length - 1];
    el.innerHTML = `<div class="stack">
      <div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? (needDraw ? 'Ziehe einen Stein: aus der Mitte oder den letzten Abwurf.' : 'Wähle einen Stein zum Abwerfen – oder melde „Fertig“.') : `${nm(g.turn)} ist dran …`}</div>
      <div class="table stack" style="align-items:center">
        <div class="row" style="justify-content:center;gap:12px">${g.players.filter(p => p !== me).map(p => `<div class="pchip ${g.turn === p ? 'turn' : ''}">${nm(p)} <span class="n">${s.hands[p].length} Steine</span>${s.disc[p].length ? this.tile(s.disc[p][s.disc[p].length - 1], s.ind, '', 'style="width:28px;height:40px;font-size:15px"') : ''}</div>`).join('')}</div>
        <div class="row" style="justify-content:center;gap:22px;margin:8px 0">
          <div class="stack" style="align-items:center;gap:4px"><span class="small muted">Anzeiger</span>${this.tile(s.ind, s.ind)}<span class="small dim">Okey: ${this.COLS[ok.c]} ${ok.n}</span></div>
          <button class="stack" style="align-items:center;gap:4px" id="center" ${needDraw ? '' : 'disabled'}><span class="small muted">Mitte (${s.deck.length})</span><div class="tile" style="background:linear-gradient(180deg,#ff8fc5,#d63a8c);color:#fff;${needDraw ? 'box-shadow:0 0 0 3px var(--mint)' : ''}">M</div></button>
          <button class="stack" style="align-items:center;gap:4px" id="takeprev" ${needDraw && prevTop ? '' : 'disabled'}><span class="small muted">Abwurf ${nm(prev)}</span>${this.tile(prevTop, s.ind, needDraw && prevTop ? 'sel' : '')}</button>
        </div>
        <div class="small muted">${esc(s.last || '')}</div>
      </div>
      <div class="row" style="justify-content:center"><span class="small muted">Sortieren:</span><button class="chip ${U.mode !== 'n' ? 'on' : ''}" data-mode="c">nach Farbe</button><button class="chip ${U.mode === 'n' ? 'on' : ''}" data-mode="n">nach Zahl</button></div>
      <div class="rack">${hand.map(t => this.tile(t, s.ind, U.selT === t ? 'sel' : '', `data-t="${t}" role="button" tabindex="0"`)).join('')}</div>
      ${canDiscard ? `<div class="row" style="justify-content:center"><button class="btn" id="disc" ${U.selT ? '' : 'disabled'}>Abwerfen</button><button class="btn primary" id="fin" ${U.selT ? '' : 'disabled'}>Fertig melden</button></div>` : ''}
      <p class="small dim" style="text-align:center;margin:0">Ziel: 14 Steine in Reihen (gleiche Farbe, 3+ Zahlen in Folge) oder Gruppen (gleiche Zahl, 3–4 Farben) – oder 7 Paare. ★-Steine mit Stern sind Joker (Okey).</p>
    </div>`;
    $$('[data-mode]', el).forEach(b => b.onclick = () => { U.mode = b.dataset.mode; this.render(el, g, me, commit, U); });
    $$('[data-t]', el).forEach(b => b.onclick = () => { U.selT = U.selT === b.dataset.t ? null : b.dataset.t; Music.sfx('click'); this.render(el, g, me, commit, U); });
    if (!myTurn) return;
    $('#center', el)?.addEventListener('click', () => { if (!needDraw) return; Music.sfx('pop'); commit(st => { if (!st.deck.length) return { winner: 'draw' }; st.hands[me].push(st.deck.pop()); st.last = `${App.name(me)} zieht aus der Mitte.`; return {}; }); });
    $('#takeprev', el)?.addEventListener('click', () => { if (!needDraw || !prevTop) return; Music.sfx('pop'); commit(st => { st.hands[me].push(st.disc[prev].pop()); st.last = `${App.name(me)} nimmt den Abwurf von ${App.name(prev)}.`; return {}; }); });
    $('#disc', el)?.addEventListener('click', () => { const t = U.selT; U.selT = null; Music.sfx('pop'); commit(st => { st.hands[me] = st.hands[me].filter(x => x !== t); st.disc[me].push(t); st.last = `${App.name(me)} wirft ab.`; return { turn: nextOf(g.players, me) }; }); });
    $('#fin', el)?.addEventListener('click', () => {
      const t = U.selT; const rest = s.hands[me].filter(x => x !== t);
      if (!this.valid(rest, s.ind)) { toast('Noch nicht fertig: Die übrigen 14 Steine bilden noch keine gültigen Reihen/Gruppen.', 'bad'); Music.sfx('lose'); return; }
      commit(st => { st.hands[me] = rest; st.disc[me].push(t); st.last = `${App.name(me)} ist fertig!`; return { winner: me }; });
    });
  },
};

const DU = {
  init(pl) {
    const f = {}; pl.forEach(p => { const m = App.members[p]; f[p] = Battle.fighter(m.pet, m.displayName, p); });
    const first = f[pl[0]].spd >= f[pl[1]].spd ? pl[0] : pl[1];
    return { state: { f, log: [`Das Duell beginnt! ${f[first].name} ist schneller.`], winner: null, fx: null }, turn: first };
  },
  render(el, g, me, commit) {
    const s = g.state, foe = g.players.find(p => p !== me), myTurn = g.turn === me && g.status === 'playing';
    el.innerHTML = `<div class="stack" style="max-width:640px;margin:0 auto;width:100%"><div class="statusline ${myTurn ? 'me' : ''}">${g.status === 'done' ? resultText(g, me) : myTurn ? 'Wähle eine Attacke!' : `${nm(foe)} wählt eine Attacke …`}</div>${BattleUI.html(s, me, foe, myTurn)}</div>`;
    if (!myTurn) return;
    $$('[data-mv]', el).forEach(b => b.onclick = () => { Music.sfx('hit'); commit(st => { Battle.use(st, me, foe, +b.dataset.mv); if (st.winner) return { winner: me }; return { turn: foe }; }); });
  },
};
