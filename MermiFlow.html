  boba: { name: 'Boba-Bar', cover: 'boba', desc: 'Bubble Tea mixen und Maschinen kaufen', tag: 'Aufbau' },
  wild: { name: 'Wilde Tiere', cover: 'wild', desc: 'Trainingsduell für dein Tier', tag: 'Tier' },
};
const Lobby = {
  mine() { return App.games.filter(g => g.players?.includes(App.me) || g.invited?.includes(App.me)); },
  invitesForMe() { return App.games.filter(g => g.status === 'lobby' && g.invited?.includes(App.me) && !g.players.includes(App.me)); },
  myTurnGames() { return App.games.filter(g => g.status === 'playing' && g.players.includes(App.me) && (GAMES[g.type]?.impl.needs ? GAMES[g.type].impl.needs(g, App.me) : g.turn === App.me)); },
  tile(id) {
    const G = GAMES[id] || SOLO[id]; const online = !!GAMES[id];
    const best = !online && App.meDoc?.best?.[id] ? `<span class="pill butter badge">Rekord ${App.meDoc.best[id]}</span>` : '';
    return `<button class="gcard" data-game="${id}"><div class="art">${Art.cover(G.cover)}</div>${online ? `<span class="pill pink badge">${G.min === G.max ? G.min : G.min + '–' + G.max} Spielerinnen</span>` : best}<div class="meta"><b>${G.name}</b><span>${online ? (G.desc.split('.')[0] + '.') : G.desc}</span></div></button>`;
  },
  bindTiles(root) { $$('[data-game]', root).forEach(b => b.onclick = () => { Music.sfx('click'); const id = b.dataset.game; if (GAMES[id]) this.createDialog(id); else if (id === 'wild') cpuDuel(); else if (id === 'bloom' || id === 'boba') Tycoon.open(id); else Arcade.open(id); }); },
  gameRow(g, kind) {
    const G = GAMES[g.type]; const others = g.players.filter(p => p !== App.me);
    return `<div class="invite-card"><div style="width:74px;border-radius:12px;overflow:hidden;flex:none">${Art.cover(G.cover)}</div><div style="flex:1;min-width:0"><b>${G.name}</b><div class="small muted ellipsis">${kind === 'invite' ? `${nm(g.host)} lädt dich ein` : kind === 'turn' ? `Du bist dran · mit ${others.map(nm).join(', ') || '…'}` : g.status === 'lobby' ? 'Wartet auf Mitspielerinnen' : `mit ${others.map(nm).join(', ')}`}</div></div><button class="btn sm ${kind === 'invite' ? 'mint' : 'primary'}" onclick="${kind === 'invite' ? `Lobby.join('${g.id}')` : `go('g-${g.id}')`}">${kind === 'invite' ? 'Beitreten' : 'Öffnen'}</button></div>`;
  },
  createDialog(type, pre) {
    const G = GAMES[type]; const mates = App.approvedMembers().filter(m => m.id !== App.me);
    const open = App.games.filter(g => g.type === type && g.status === 'lobby' && !g.players.includes(App.me) && g.players.length < G.max && (g.invited || []).includes(App.me));
    const m = modal(`<div class="modal-head"><div><div class="eyebrow">${G.min === G.max ? G.min : G.min + '–' + G.max} Spielerinnen · online</div><div class="h2">${G.name}</div></div><button class="icon-btn" data-close>${icon('x')}</button></div>
      <div class="stack"><div style="border-radius:18px;overflow:hidden;aspect-ratio:16/7">${Art.cover(G.cover)}</div><p class="muted" style="margin:0">${G.desc}</p>
      ${open.length ? `<div class="stack" style="gap:8px"><div class="h3">Offene Einladungen</div>${open.map(g => `<div class="li"><div class="grow"><b>${nm(g.host)}</b> wartet</div><button class="btn sm mint" data-join="${g.id}">Beitreten</button></div>`).join('')}</div>` : ''}
      <div class="h3">Wen lädst du ein?</div>
      ${mates.length ? `<div class="row">${mates.map(x => `<label class="chip"><input type="checkbox" value="${x.id}" ${pre === x.id || (G.max === 2 && mates.length === 1) || (G.max > 2) ? 'checked' : ''} style="accent-color:var(--pink)"><span class="av-sm" style="width:24px;height:24px;border-radius:8px">${Art.avatar(x.avatar, { bust: true })}</span>${esc(x.displayName)}</label>`).join('')}</div>` : `<div class="empty small">Noch keine Freundinnen freigegeben. Sobald sie da sind, könnt ihr hier zusammen spielen.</div>`}
      <div class="err" id="cerr"></div>
      <button class="btn primary lg" id="create" ${mates.length ? '' : 'disabled'}>Spiel erstellen</button></div>`);
    $$('[data-join]', m.el).forEach(b => b.onclick = () => { m.close(); this.join(b.dataset.join); });
    $('#create', m.el).onclick = async () => {
      const inv = $$('input[type=checkbox]:checked', m.el).map(c => c.value);
      if (inv.length < G.min - 1) return $('#cerr', m.el).textContent = `Lade mindestens ${G.min - 1} Freundin ein.`;
      if (inv.length > G.max - 1) return $('#cerr', m.el).textContent = `${G.name} geht mit höchstens ${G.max} Spielerinnen. Wähle ${G.max - 1} aus.`;
      const id = rid(); const now = Date.now();
      await put(`games/${id}`, { type, host: App.me, players: [App.me], invited: inv, status: 'lobby', state: {}, turn: null, winner: null, createdAt: now, updatedAt: now, seq: 0 });
      if (App.demo) { for (const u of inv) { const g = await Store.get(`games/${id}`); await save(`games/${id}`, { players: [...g.players, u] }); } }
      m.close(); go('g-' + id);
      sendChat(`🎮 ${App.meDoc.displayName} lädt zu ${G.name} ein!`, 'system').catch(() => { });
    };
  },
  async join(gid) {
    const g = App.games.find(x => x.id === gid); if (!g) return;
    if (!g.players.includes(App.me)) { const fresh = await Store.get(`games/${gid}`); const pl = [...new Set([...(fresh?.players || g.players), App.me])]; if (pl.length > GAMES[g.type].max) return toast('Das Spiel ist schon voll.', 'bad'); await save(`games/${gid}`, { players: pl, updatedAt: Date.now() }); }
    go('g-' + gid);
  },
  async start(g) {
    const G = GAMES[g.type]; if (g.players.length < G.min) return;
    if (g.type === 'duel' && g.players.some(p => !App.members[p]?.pet)) return toast('Beide brauchen ein Tier.', 'bad');
    const { state, turn } = G.impl.init(g.players.slice());
    await save(`games/${g.id}`, { status: 'playing', state, turn, startedAt: Date.now(), updatedAt: Date.now() });
    Music.sfx('win');
  },
  async rematch(g) {
    const id = rid(); const now = Date.now(); const others = g.players.filter(p => p !== App.me);
    await put(`games/${id}`, { type: g.type, host: App.me, players: [App.me], invited: others, status: 'lobby', state: {}, turn: null, winner: null, createdAt: now, updatedAt: now, seq: 0, rematchOf: g.id });
    if (App.demo) await save(`games/${id}`, { players: [App.me, ...others] });
    go('g-' + id);
  },
  _credit: new Set(),
  async checkRewards() {
    const m = App.meDoc; if (!m) return;
    for (const g of App.games) {
      if (g.status !== 'done' || !g.players.includes(App.me) || m.credited?.[g.id] || this._credit.has(g.id)) continue;
      this._credit.add(g.id);
      const won = g.winner === App.me, draw = g.winner === 'draw';
      const stats = { wins: (m.stats?.wins || 0) + (won ? 1 : 0), games: (m.stats?.games || 0) + 1 };
      m.stats = stats; m.credited = { ...(m.credited || {}), [g.id]: true };
      await save(`members/${App.me}`, { stats, credited: { [g.id]: true } });
      await addCoins(won ? 50 : draw ? 20 : 10, won ? `Sieg in ${GAMES[g.type].name}` : 'fürs Mitspielen');
      if (g.type === 'duel') await Pets.apply({ xp: (Pets.live(App.meDoc.pet).xp || 0) + (won ? 30 : 8), wins: (App.meDoc.pet.wins || 0) + (won ? 1 : 0) });
      if (won) { confetti(); Music.sfx('win'); sendChat(`🏆 ${App.meDoc.displayName} gewinnt ${GAMES[g.type].name}${g.players.length > 1 ? ' gegen ' + g.players.filter(p => p !== App.me).map(p => App.name(p)).join(' & ') : ''}!`, 'system').catch(() => { }); }
      else if (!draw && App.route === 'g-' + g.id) Music.sfx('lose');
      if (App.demo) break;
    }
  },
  gameView(gid) {
    let root, body, lastSeq = -1, lastStatus = '';
    const draw = (force) => {
      const g = App.games.find(x => x.id === gid);
      if (!g) { root.innerHTML = `<div class="empty">Dieses Spiel gibt es nicht mehr. <button class="btn sm" onclick="go('games')">Zu den Spielen</button></div>`; return; }
      const G = GAMES[g.type]; const U = ui(gid);
      let me = App.me;
      if (App.demo && g.status === 'playing') { me = U.viewAs || (g.players.includes(g.turn) ? g.turn : App.me); if (g.type === 'battleship' && g.state.phase === 'place') me = U.viewAs || g.players.find(p => !g.state.ready[p]) || App.me; }
      const sig = g.seq + ':' + g.updatedAt;
      if (!force && sig === lastSeq && g.status === lastStatus && U.lastMe === me && g.players.length === U.lastPl) return;
      lastSeq = sig; lastStatus = g.status; U.lastMe = me; U.lastPl = g.players.length;
      const inGame = g.players.includes(App.me);
      root.innerHTML = `<div class="game-shell">
        <div class="row between"><div class="row" style="gap:10px"><button class="icon-btn" onclick="go('games')" aria-label="Zurück">${icon('back')}</button><div><div class="eyebrow">${g.status === 'lobby' ? 'Warteraum' : g.status === 'done' ? 'Beendet' : 'Läuft'}</div><div class="h2">${G.name}</div></div></div>
          <div class="row">${g.status === 'lobby' && g.host === App.me ? `<button class="btn sm ghost" id="cancel">Abbrechen</button>` : ''}${g.status === 'playing' && inGame ? `<button class="btn sm ghost" id="giveup">Aufgeben</button>` : ''}${g.status === 'done' && inGame ? `<button class="btn sm primary" id="rematch">Revanche</button>` : ''}</div></div>
        <div class="players-bar">${g.players.map(p => `<div class="pchip ${g.status === 'playing' && g.turn === p ? 'turn' : ''}"><div class="av-sm" style="width:30px;height:30px;border-radius:10px">${App.members[p] ? Art.avatar(App.members[p].avatar, { bust: true }) : ''}</div><div>${nm(p)}${p === App.me ? ' <span class="n">(du)</span>' : ''}${g.winner === p ? ' 🏆' : ''}</div></div>`).join('')}${(g.invited || []).filter(p => !g.players.includes(p)).map(p => `<div class="pchip" style="opacity:.55">${nm(p)} <span class="n">eingeladen</span></div>`).join('')}</div>
        ${App.demo && g.status === 'playing' ? `<div class="row small"><span class="muted">Vorschau – spielen als:</span>${g.players.map(p => `<button class="chip ${me === p ? 'on' : ''}" data-as="${p}">${nm(p)}</button>`).join('')}</div>` : ''}
        <div id="gbody"></div></div>`;
      body = $('#gbody', root);
      $$('[data-as]', root).forEach(b => b.onclick = () => { U.viewAs = b.dataset.as; draw(true); });
      $('#cancel', root)?.addEventListener('click', async () => { await save(`games/${gid}`, { status: 'cancelled', updatedAt: Date.now() }); go('games'); });
      $('#giveup', root)?.addEventListener('click', async () => { if (!await confirmBox('Wirklich aufgeben?', 'Aufgeben')) return; const others = g.players.filter(p => p !== me); await save(`games/${gid}`, { status: 'done', winner: others.length === 1 ? others[0] : 'draw', updatedAt: Date.now() }); });
      $('#rematch', root)?.addEventListener('click', () => this.rematch(g));
      if (g.status === 'cancelled') { body.innerHTML = `<div class="empty">Dieses Spiel wurde abgebrochen.</div>`; return; }
      if (g.status === 'lobby') {
        const can = g.players.length >= G.min;
        body.innerHTML = `<div class="card stack" style="align-items:center;text-align:center;padding:28px"><div style="width:min(320px,100%);border-radius:18px;overflow:hidden">${Art.cover(G.cover)}</div><p class="muted" style="max-width:48ch;margin:0">${G.desc}</p>
          ${!inGame ? `<button class="btn primary lg" id="joinb">Beitreten</button>` : g.host === App.me ? `<button class="btn primary lg" id="startb" ${can ? '' : 'disabled'}>${can ? 'Spiel starten' : `Warte auf Mitspielerinnen (${g.players.length}/${G.min})`}</button>` : `<div class="pill mint">Du bist dabei – ${nm(g.host)} startet gleich.</div>`}</div>`;
        $('#joinb', body)?.addEventListener('click', () => this.join(gid));
        $('#startb', body)?.addEventListener('click', () => this.start(g));
        return;
      }
      const commit = async (fn) => {
        const cur = App.games.find(x => x.id === gid); if (!cur || cur.status !== 'playing') return;
        const st = clone(cur.state); const meta = fn(st) || {};
        const patch = { state: st, updatedAt: Date.now(), seq: (cur.seq || 0) + 1 };
        if (meta.turn !== undefined) patch.turn = meta.turn;
        if (meta.winner !== undefined) { patch.winner = meta.winner; patch.status = 'done'; patch.turn = null; }
        Object.assign(cur, patch); draw(true);
        try { await save(`games/${gid}`, patch); } catch (e) { toast('Zug konnte nicht gespeichert werden.', 'bad'); }
      };
      G.impl.render(body, g, me, commit, U);
      if (g.status === 'playing') G.impl.tick?.(g);
    };
    return {
      mount(el) { root = el; draw(true); this.t = setInterval(() => draw(), 4000); },
      unmount() { clearInterval(this.t); },
      onData(k) { if (k === 'games' || k === 'members') draw(k === 'members'); },
    };
  },
};

        if (w.state === 'idle') { let best = -1; for (let i = 0; i < S.nPlots; i++) if (ripe(i) && !reserved.has(i)) { best = i; break; } if (best >= 0) { reserved.add(best); w.state = 'go'; w.i = best; const q = plotC(best); w.tx = q.x + rnd(-6, 6); w.ty = q.y + L.plots[best].h * .35; } else if (w.carry.length) { w.state = 'deliver'; const c = counterC(); w.tx = c.x + rnd(-40, 40); w.ty = c.y + rnd(0, 10); } }
        const arrived = walk(w, dt, sp * .7);
        if (arrived && w.state === 'go') { if (ripe(w.i)) { w.carry.push(S.plots[w.i].p); S.plots[w.i].t = Date.now(); dirty = true; } reserved.delete(w.i); w.state = w.carry.length >= 3 ? 'deliver' : 'idle'; if (w.state === 'deliver') { const c = counterC(); w.tx = c.x + rnd(-40, 40); w.ty = c.y + rnd(0, 10); } }
        else if (arrived && w.state === 'deliver') { stock.push(...w.carry); w.carry = []; w.state = 'idle'; if (stock.length > 60) stock = stock.slice(-60); }
      }
      // customers + sellers
      custT -= dt; if (custT <= 0 && customers.length < 5) { customers.push({ x: W + 30, y: counterC().y + 10, tx: 0, ty: 0, col: pick(['#ff9ad0', '#7cc8ff', '#ffd86b', '#b48cff', '#55eec6', '#ff8a6b']), skin: pick(Art.SKINS), head: pick(['#1e1720', '#7a1f33', '#3a241a', '#c9a0dc', '#d9b07a']), leaving: false }); custT = rnd(2, 5); }
      customers.forEach((c, i) => { if (!c.leaving) { c.tx = counterC().x + L.counter.w * .25 + i * L.cs * 2.2; c.ty = counterC().y + L.cs * .6; } walk(c, dt, sp * .35); });
      customers = customers.filter(c => !(c.leaving && c.tx == null));
      for (const s of sellers) { s.cd -= dt; if (s.cd <= 0 && stock.length && customers.length && !customers[0].leaving && customers[0].tx == null) { s.cd = 1.6; const item = stock.shift(); sellItems([item], counterC().x, L.counter.y - 10); const c = customers.shift(); c.leaving = true; c.tx = W + 60; c.ty = c.y; customers.push(c); } }
      // draw
      const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, T.sky[0]); sky.addColorStop(1, T.sky[1]); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = T.ground; ctx.fillRect(0, H * .06, W, H); ctx.fillStyle = T.ground2; for (let y = H * .06; y < H; y += 28) ctx.fillRect(0, y, W, 14);
      for (let i = 0; i < 12; i++) {
        const p = L.plots[i];
        if (i >= S.nPlots) { ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 12); ctx.stroke(); ctx.setLineDash([]); continue; }
        ctx.fillStyle = T.plot2; ctx.beginPath(); ctx.roundRect(p.x, p.y + 4, p.w, p.h, 14); ctx.fill(); ctx.fillStyle = T.plot; ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 14); ctx.fill(); ctx.strokeStyle = '#1d1026'; ctx.lineWidth = 2.5; ctx.stroke();
        const pr = prog(i), P = T.products[S.plots[i].p], cx = p.x + p.w / 2, cy = p.y + p.h / 2, rp = pr >= 1;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (rp) { const b = Math.sin(t / 200 + i) * 3; ctx.font = `${Math.min(p.w, p.h) * .62}px serif`; ctx.fillText(P.e, cx, cy + b); ctx.fillStyle = '#fff'; ctx.globalAlpha = .7 + Math.sin(t / 150 + i) * .3; ctx.font = `${Math.min(p.w, p.h) * .22}px serif`; ctx.fillText('✨', cx + p.w * .3, cy - p.h * .3); ctx.globalAlpha = 1; }
        else { ctx.font = `${Math.min(p.w, p.h) * (.2 + pr * .35)}px serif`; ctx.globalAlpha = .55 + pr * .45; ctx.fillText(pr < .4 ? '🌱' : P.e, cx, cy + (1 - pr) * 6); ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x + p.w - 14, p.y + 14, 8, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); ctx.stroke(); }
      }
      // counter
      const c = L.counter; ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.roundRect(c.x, c.y + 8, c.w, c.h, 16); ctx.fill();
      ctx.fillStyle = T.counter; ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 16); ctx.fill(); ctx.strokeStyle = '#1d1026'; ctx.lineWidth = 3; ctx.stroke();
      const stripes = 8; for (let k = 0; k < stripes; k++) { ctx.fillStyle = T.awning[k % 2]; ctx.beginPath(); ctx.roundRect(c.x - 6 + k * (c.w + 12) / stripes, c.y - c.h * .55, (c.w + 12) / stripes, c.h * .4, [0, 0, 10, 10]); ctx.fill(); ctx.strokeStyle = '#1d1026'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.max(11, c.h * .2)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText(T.label, c.x + c.w / 2, c.y + c.h * .38);
      ctx.font = `${c.h * .26}px serif`; stock.slice(0, 8).forEach((p, k) => ctx.fillText(T.products[p].e, c.x + c.w * .15 + k * c.w * .1, c.y + c.h * .72));
      if (stock.length > 8) { ctx.font = `700 ${c.h * .16}px sans-serif`; ctx.fillStyle = '#fff'; ctx.fillText('+' + (stock.length - 8), c.x + c.w * .92, c.y + c.h * .72); }
      for (let k = 0; k < S.sellers; k++) person(c.x + c.w * (.25 + k * .25), c.y - c.h * .05, { body: T.seller.col, skin: '#efc1a1', head: '#2a1a14' });
      customers.forEach(cu => person(cu.x, cu.y, { body: cu.col, skin: cu.skin, head: cu.head, moving: cu.tx != null }));
      workers.forEach(w => person(w.x, w.y, { body: T.worker.col, skin: '#e5ad86', head: '#3a241a', tag: T.worker.e, carry: w.carry, moving: w.tx != null }));
      person(me.x, me.y, { body: av.topColor || '#2b282f', skin: av.skin, head: av.head === 'hijab' ? av.hijab : av.hairColor, carry: me.carry, moving, tag: headImg ? null : '👑', img: headImg });
      floats = floats.filter(f => (f.l -= dt * .9) > 0); ctx.textAlign = 'center'; for (const f of floats) { ctx.globalAlpha = f.l; ctx.fillStyle = '#ffb300'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.font = `800 ${L.cs * 1.1}px sans-serif`; ctx.strokeText(f.t, f.x, f.y - (1 - f.l) * 50); ctx.fillText(f.t, f.x, f.y - (1 - f.l) * 50); } ctx.globalAlpha = 1;
      sideT -= dt; if (sideT <= 0) { sideT = .5; drawSide(); }
      if (Date.now() - savedAt > 8000) persist();
      G.raf = requestAnimationFrame(loop);
    };
    G = { raf: requestAnimationFrame(loop) };
  },
};
